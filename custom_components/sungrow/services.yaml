backfill:
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: sungrow
    start_date:
      required: false
      selector:
        date:

set_battery_mode:
  fields:
    mode:
      required: true
      example: force_charge
      selector:
        select:
          options:
            - self_consumption
            - force_charge
            - force_discharge
            - stop
    duration_minutes:
      required: false
      example: 120
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
          mode: box
    entity_id:
      required: false
      selector:
        entity:
          integration: sungrow
          domain: select
    device_id:
      required: false
      selector:
        device:
          integration: sungrow
    config_entry:
      required: false
      selector:
        config_entry:
          integration: sungrow
refresh_tokens:
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: sungrow
read_registers:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: sungrow
    register_type:
      required: false
      example: input
      default: input
      selector:
        select:
          options:
            - input
            - holding
    start:
      required: true
      example: 4999
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      required: false
      example: 2
      default: 1
      selector:
        number:
          min: 1
          max: 125
          mode: box
    unit:
      required: false
      example: 1
      selector:
        number:
          min: 0
          max: 247
          mode: box
