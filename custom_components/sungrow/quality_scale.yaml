# Home Assistant Integration Quality Scale — self-assessment.
#
# Note: hassfest only *validates* this file for core integrations; for a custom
# (HACS) integration it is an honest status record and roadmap. The integration
# currently meets the Bronze and Silver tiers (and already satisfies several Gold
# and Platinum rules).
rules:
  # --- Bronze ---
  action-setup:
    status: exempt
    comment: The integration registers no actions/services.
  appropriate-polling:
    status: done
  brands:
    status: exempt
    comment: >-
      Custom/HACS integration. Brand images are shipped in the repository; the
      home-assistant/brands repository applies to core integrations only.
  common-modules:
    status: done
  config-flow:
    status: done
  config-flow-test-coverage:
    status: done
  dependency-transparency:
    status: done
  docs-actions:
    status: exempt
    comment: No actions/services are registered.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-removal-instructions:
    status: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: done
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
  runtime-data:
    status: done
  test-before-configure:
    status: exempt
    comment: >-
      Two-phase OAuth setup: the hub entry is created first so the callback
      endpoint exists for the redirect, then credentials are validated during
      authorization (reauth). Validating before entry creation isn't possible
      with this flow.
  test-before-setup:
    status: done
  unique-config-entry:
    status: done

  # --- Silver ---
  action-exceptions:
    status: exempt
    comment: No actions/services are registered.
  config-entry-unloading:
    status: done
  docs-configuration-parameters:
    status: done
  docs-installation-parameters:
    status: done
  entity-unavailable:
    status: done
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
  parallel-updates:
    status: done
  reauthentication-flow:
    status: done
  test-coverage:
    status: done

  # --- Gold ---
  devices:
    status: done
    comment: Sensors group under a plant device; dispatch controls under their own device.
  diagnostics:
    status: done
  discovery:
    status: exempt
    comment: Cloud-polling integration; devices are enumerated via the API, not discovered on the network.
  discovery-update-info:
    status: exempt
    comment: No network discovery.
  docs-data-update:
    status: todo
  docs-examples:
    status: todo
  docs-known-limitations:
    status: done
  docs-supported-devices:
    status: done
  docs-supported-functions:
    status: done
  docs-troubleshooting:
    status: done
  docs-use-cases:
    status: todo
  dynamic-devices:
    status: todo
  entity-category:
    status: exempt
    comment: >-
      All entities are primary function: plant/device measurements (sensors) and
      the active dispatch controls (number/select). None are auxiliary config or
      diagnostic entities, and the sensor set is dynamic from the API, so no
      entity warrants a config/diagnostic category.
  entity-device-class:
    status: done
  entity-disabled-by-default:
    status: done
    comment: Sensors with an unknown/empty initial value are disabled by default.
  entity-translations:
    status: done
    comment: >-
      Dispatch number/select entities use translation keys (entity.number/select
      in strings.json). Sensors are created dynamically from API point codes, so
      their names are derived from the code and cannot use fixed translation keys.
  exception-translations:
    status: done
    comment: >-
      Dispatch write failures raise HomeAssistantError with the translation key
      exceptions.dispatch_write_failed.
  icon-translations:
    status: done
    comment: >-
      Dispatch number/select entities provide icons via icons.json. Sensor icons
      come from their device class (or a solar fallback for unclassified points).
  reconfiguration-flow:
    status: done
  repair-issues:
    status: todo
  stale-devices:
    status: todo

  # --- Platinum ---
  async-dependency:
    status: done
    comment: The sungrow-isolarcloud client is fully async.
  inject-websession:
    status: done
    comment: The Home Assistant aiohttp client session is injected into the API client.
  strict-typing:
    status: todo
    comment: mypy runs in CI (check_untyped_defs) but not yet in strict mode.
