# Home Assistant Integration Quality Scale — self-assessment.
#
# Note: hassfest only *validates* this file for core integrations; for a custom
# (HACS) integration it is an honest status record. Every Bronze, Silver and Gold
# rule is done or exempt, and all three Platinum rules (async-dependency,
# inject-websession, strict-typing) are met. The manifest declares "platinum".
rules:
  # --- Bronze ---
  action-setup:
    status: exempt
    comment: The integration registers no actions/services.
  appropriate-polling:
    status: done
  brands:
    status: exempt
    comment: >-
      Custom/HACS integration. Brand images are shipped in the repository; the
      home-assistant/brands repository applies to core integrations only.
  common-modules:
    status: done
  config-flow:
    status: done
  config-flow-test-coverage:
    status: done
  dependency-transparency:
    status: done
  docs-actions:
    status: exempt
    comment: No actions/services are registered.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-removal-instructions:
    status: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: done
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
  runtime-data:
    status: done
  test-before-configure:
    status: exempt
    comment: >-
      Two-phase OAuth setup: the hub entry is created first so the callback
      endpoint exists for the redirect, then credentials are validated during
      authorization (reauth). Validating before entry creation isn't possible
      with this flow.
  test-before-setup:
    status: done
  unique-config-entry:
    status: done

  # --- Silver ---
  action-exceptions:
    status: exempt
    comment: No actions/services are registered.
  config-entry-unloading:
    status: done
  docs-configuration-parameters:
    status: done
  docs-installation-parameters:
    status: done
  entity-unavailable:
    status: done
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
  parallel-updates:
    status: done
  reauthentication-flow:
    status: done
  test-coverage:
    status: done

  # --- Gold ---
  devices:
    status: done
    comment: >-
      Each physical device (inverter/battery/meter/comm module) is modelled as its
      own HA device nested under the plant via via_device and enriched with
      model/serial/manufacturer; plant sensors re-home onto the device they
      describe (#158) and dispatch controls attach to the dispatch device.
  diagnostics:
    status: done
  discovery:
    status: exempt
    comment: Cloud-polling integration; devices are enumerated via the API, not discovered on the network.
  discovery-update-info:
    status: exempt
    comment: No network discovery.
  docs-data-update:
    status: done
    comment: README "How data updates" documents cloud polling, interval and availability.
  docs-examples:
    status: done
    comment: README "Example automations" gives battery dispatch and low-SOC alert examples.
  docs-known-limitations:
    status: done
  docs-supported-devices:
    status: done
  docs-supported-functions:
    status: done
  docs-troubleshooting:
    status: done
  docs-use-cases:
    status: done
    comment: README "Use cases" describes monitoring, time-of-use battery control and alerting.
  dynamic-devices:
    status: done
    comment: >-
      The coordinator refreshes each plant's device list every poll; the sensor
      and dispatch platforms add entities for devices/points that appear after
      setup via a coordinator listener.
  entity-category:
    status: done
    comment: >-
      The SOC-limit numbers and the forced-charging select are
      EntityCategory.CONFIG (they set battery policy); the active charge/discharge
      controls and all plant/device sensors are primary function.
  entity-device-class:
    status: done
  entity-disabled-by-default:
    status: done
    comment: Sensors with an unknown/empty initial value are disabled by default.
  entity-translations:
    status: done
    comment: >-
      Dispatch number/select entities use translation keys (entity.number/select
      in strings.json). Sensors are created dynamically from API point codes, so
      their names are derived from the code and cannot use fixed translation keys.
  exception-translations:
    status: done
    comment: >-
      Dispatch write failures raise HomeAssistantError with the translation key
      exceptions.dispatch_write_failed.
  icon-translations:
    status: done
    comment: >-
      Dispatch number/select entities provide icons via icons.json. Sensor icons
      come from their device class (or a solar fallback for unclassified points).
  reconfiguration-flow:
    status: done
  repair-issues:
    status: done
    comment: >-
      Developer-Portal whitelist rejections (E918/E919) and API quota/rate-limit
      rejections (E998/E999) surface as actionable Home Assistant Repairs via the
      coordinator's _async_raise_repair, and clear automatically once the plant
      recovers (_async_clear_repairs on a successful poll) (#153). Invalid/expired
      credentials are handled separately through the reauthentication flow
      (ConfigEntryAuthFailed -> async_step_reauth).
  stale-devices:
    status: done
    comment: >-
      Devices that disappear from the API are pruned from the device registry
      automatically after each refresh (_async_prune_stale_devices);
      async_remove_config_entry_device remains as the manual fallback.

  # --- Platinum ---
  async-dependency:
    status: done
    comment: The sungrow-isolarcloud client is fully async.
  inject-websession:
    status: done
    comment: The Home Assistant aiohttp client session is injected into the API client.
  strict-typing:
    status: done
    comment: >-
      mypy runs in --strict mode (strict = true in pyproject) and the package
      ships a py.typed marker.
