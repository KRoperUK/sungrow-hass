# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Stages:
# * ``pre-commit`` — fast checks (ruff, mypy, manifest sort). Run on every commit.
# * ``pre-push`` — the full pytest suite. Runs once per push so a commit-heavy
#   local workflow isn't slowed down by re-running tests on each fixup.
#
# Enable both stages once with:
#   pre-commit install --hook-type pre-commit --hook-type pre-push
repos:
  # Ruff runs from the dev virtualenv (``language: system``) instead of the upstream
  # ``ruff-pre-commit`` hook. That hook makes pre-commit build its own Python environment,
  # which fails on any interpreter whose ``pyexpat`` was linked against a newer libexpat
  # than the OS ships (Homebrew Python 3.14 on macOS: undefined symbol
  # ``_XML_SetAllocTrackerActivationThreshold``), so the hook could not run at all. This
  # also keeps the ruff version pinned in exactly one place — requirements_test.txt,
  # mirrored by ci.yml — rather than also in a ``rev`` here.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: .venv/bin/ruff check
        args: [--fix]
        types_or: [python, pyi]
        language: system
      - id: ruff-format
        name: ruff (format)
        entry: .venv/bin/ruff format
        types_or: [python, pyi]
        language: system

      # Keep manifest.json keys in the order hassfest expects (domain/name first,
      # then alphabetical) so CI's hassfest validation never trips on ordering.
      - id: sort-manifest
        name: sort manifest.json
        entry: python scripts/sort_manifest.py
        language: system
        files: ^custom_components/sungrow/manifest\.json$
        pass_filenames: false

      # The supported-models page is generated from MODEL_SPECS, so regenerate it whenever
      # the catalog changes. tests/test_supported_models_doc.py fails CI if it is still stale.
      - id: generate-supported-models
        name: generate docs/SUPPORTED_MODELS.md
        entry: .venv/bin/python scripts/generate_supported_models.py
        language: system
        files: ^(custom_components/sungrow/model_specs\.py|docs/SUPPORTED_MODELS\.md)$
        pass_filenames: false

      # Strict mypy on the whole integration + tests. Runs once per commit
      # regardless of which files staged — mypy's cross-file inference means
      # a change in one module can surface an error in another.
      - id: mypy
        name: mypy (strict)
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        # Any Python source touched should trip mypy; the ``files`` setting in
        # pyproject.toml narrows the scope to ``custom_components/sungrow``.
        files: \.py$
        stages: [pre-commit]

      # Full pytest run on push so no broken commit reaches origin. ``--no-cov -q``
      # keeps the pre-push wait short; CI still runs the coverage-gated variant.
      - id: pytest
        name: pytest (no-cov)
        entry: .venv/bin/python -m pytest tests/ --no-cov -q
        language: system
        pass_filenames: false
        stages: [pre-push]
