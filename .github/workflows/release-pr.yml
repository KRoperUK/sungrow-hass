name: Release PR

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    workflow_dispatch: {}

permissions:
    contents: write
    pull-requests: write
    issues: write

concurrency:
    group: release-pr
    cancel-in-progress: false

jobs:
    release-pr:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'main' &&
             github.event.workflow_run.event == 'push' &&
             !contains(github.event.workflow_run.head_commit.message, 'chore: release') &&
             !contains(github.event.workflow_run.head_commit.message, '[skip ci]'))
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  # Check out the branch, NOT the triggering SHA: the changelog
                  # action runs `git pull --tags --ff-only`, which fails in a
                  # detached HEAD ("You are not currently on a branch").
                  ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
                  fetch-depth: 0

            - name: Conventional Changelog (no tag/release)
              id: changelog
              # Version bump rules with the conventionalcommits preset:
              #   feat! / fix! / BREAKING CHANGE -> major
              #   feat                             -> minor
              #   fix                              -> patch
              #   chore / docs / style / refactor / test / ci / build -> no release
              uses: TriPSs/conventional-changelog-action@952b14bbc4be87e8458a6ac5926fc655608b1b19 # v6
              with:
                  github-token: ${{ github.token }}
                  output-file: CHANGELOG.md
                  tag-prefix: v
                  skip-on-empty: true
                  version-file: custom_components/sungrow/manifest.json
                  version-path: version
                  preset: conventionalcommits
                  create-summary: true
                  skip-tag: true
                  skip-commit: true
                  # Redundant with fetch-depth: 0 and the exact call that fails in
                  # detached HEAD — skip it.
                  skip-git-pull: true
                  # The release PR is pushed by create-pull-request below, not by
                  # this action.
                  git-push: false

            - name: Sync versions to manifest and pyproject
              if: steps.changelog.outputs.skipped != 'true'
              # Pass the computed version via env, not inline ${{ }}, so it can't be
              # shell-injected.
              env:
                  VERSION: ${{ steps.changelog.outputs.version }}
              run: |
                  # Update manifest.json (preserving quotes and comma)
                  sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" custom_components/sungrow/manifest.json
                  # Update pyproject.toml
                  sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
                  echo "Updated manifest.json and pyproject.toml to version ${VERSION}"

            - name: Create release PR
              if: steps.changelog.outputs.skipped != 'true'
              uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
              with:
                  token: ${{ github.token }}
                  committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
                  author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
                  commit-message: "chore: release v${{ steps.changelog.outputs.version }}"
                  branch: "release/v${{ steps.changelog.outputs.version }}"
                  title: "chore: release v${{ steps.changelog.outputs.version }}"
                  body: |
                      ## Summary
                      - release version v${{ steps.changelog.outputs.version }}

                      ## Changelog
                      ${{ steps.changelog.outputs.clean_changelog }}

                  labels: |
                      release
                  add-paths: |
                      CHANGELOG.md
                      custom_components/sungrow/manifest.json
                      pyproject.toml
