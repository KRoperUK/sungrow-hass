name: Cleanup stale dev releases

# Dev pre-releases accumulate for version lines that never ship a real release
# (abandoned PR builds, superseded next-version dev builds). A published release
# prunes the current main dev builds, but the long tail needs a scheduled sweep.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cleanup-dev-releases
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete dev pre-releases older than 30 days
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Delete a release and its tag ref, treating an already-missing tag
          # as success (see cleanup-pr-release.yml): drop the release, then
          # remove the tag ref only if it still exists so a shared/removed ref
          # can't 404 and fail the sweep under `bash -e`.
          delete_release_and_tag() {
            tag="$1"
            gh release delete "$tag" --yes 2>/dev/null || true
            if gh api "repos/${GH_REPO}/git/refs/tags/${tag}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GH_REPO}/git/refs/tags/${tag}" >/dev/null \
                && echo "Deleted tag ref ${tag}" \
                || echo "Warning: could not delete tag ref ${tag}"
            else
              echo "Tag ${tag} already absent — nothing to clean up"
            fi
          }

          # Sweep pre-releases older than 30 days:
          #   - current: vX.Y.Z-rc.N / vX.Y.Z-pr.P.R
          #   - legacy:  dev-*
          # Real stable releases (exact vX.Y.Z, non-prerelease) are never listed here.
          CUTOFF=$(date -u -d '30 days ago' +%s)
          echo "Deleting matching pre-releases created before $(date -u -d @"$CUTOFF")"
          gh release list --limit 1000 --json tagName,isPrerelease,createdAt \
            --jq '.[] | select(.isPrerelease) | [.tagName, .createdAt] | @tsv' \
          | while IFS=$'\t' read -r tag created; do
              case "$tag" in
                dev-*) ;;
                v[0-9]*.[0-9]*.[0-9]*-rc.*|v[0-9]*.[0-9]*.[0-9]*-pr.*) ;;
                *) continue ;;
              esac
              created_epoch=$(date -u -d "$created" +%s)
              if [ "$created_epoch" -lt "$CUTOFF" ]; then
                echo "Deleting stale pre-release: ${tag} (created ${created})"
                delete_release_and_tag "$tag"
              fi
            done
