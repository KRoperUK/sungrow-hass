name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether the change touches the integration itself. Non-impacting changes
  # (docs, README, other workflows, etc.) skip the heavy jobs below — which, because a
  # job skipped via `if` reports "success", still satisfies the required checks so the
  # PR stays mergeable, but wastes no compute and mints no dev build.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      component: ${{ steps.filter.outputs.component }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            component:
              - 'custom_components/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'requirements_test.txt'
              - 'hacs.json'
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install ruff
        # Pin to the same ruff as the test env (requirements_test.txt) so lint and
        # format can't drift between the two jobs.
        run: pip install "$(grep -E '^ruff==' requirements_test.txt)"

      - name: Lint with ruff
        # --output-format=github emits ::error annotations inline on the offending
        # lines in the PR "Files changed" view.
        run: ruff check --output-format=github custom_components/ tests/

      - name: Check formatting
        run: ruff format --check custom_components/ tests/

  test:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Home Assistant requires Python >=3.13, so that's the only supported
          # runtime for this integration.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: pip install -r requirements_test.txt

      - name: Type check with mypy
        # Convert mypy output into GitHub annotations (inline on the PR diff) while
        # preserving its exit status via pipefail, so type errors are surfaced on the
        # offending line instead of only in the raw log.
        run: |
          set -o pipefail
          mypy | sed -E \
            -e 's/^([^:]+):([0-9]+): error: (.*)$/::error file=\1,line=\2::\3/' \
            -e 's/^([^:]+):([0-9]+): note: (.*)$/::notice file=\1,line=\2::\3/'

      - name: Run tests with coverage
        run: >-
          pytest tests/
          --cov=custom_components/sungrow --cov-branch
          --cov-report=xml --cov-report=term-missing
          --junitxml=junit.xml -o junit_family=legacy
          -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml

  hacs_validate:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c # master

  # Branch dev builds — a same-repo PR that changed the component, once CI is green.
  # Fork PRs get a read-only token (release would fail) and this job holds
  # contents: write, so keep it to same-repo. Never for the release-please PR branch.
  dev-release:
    needs: [changes, lint, test, hacs_validate]
    if: >-
      needs.changes.outputs.component == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Immutable head SHA (the branch can be deleted by a racing merge), with
          # full history + tags for the changelog action.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Compute next version
        id: nextver
        uses: TriPSs/conventional-changelog-action@952b14bbc4be87e8458a6ac5926fc655608b1b19 # v6
        with:
          github-token: ${{ github.token }}
          version-file: custom_components/sungrow/manifest.json
          version-path: version
          tag-prefix: v
          preset: conventionalcommits
          skip-on-empty: true
          skip-version-file: true
          skip-commit: true
          skip-tag: true
          skip-git-pull: true
          git-push: false
          output-file: false

      - name: Compute dev tag
        id: tag
        env:
          SKIPPED: ${{ steps.nextver.outputs.skipped }}
          NEXT_VERSION: ${{ steps.nextver.outputs.version }}
          HEAD_BRANCH: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$SKIPPED" = "true" ] || [ -z "$NEXT_VERSION" ]; then
            VERSION=$(jq -r .version custom_components/sungrow/manifest.json)
          else
            VERSION="$NEXT_VERSION"
          fi
          WORKFLOW_EVENT=pull_request
          export VERSION HEAD_BRANCH RUN_ID WORKFLOW_EVENT
          TAG=$(bash scripts/compute-dev-tag.sh)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          BRANCH_RAW: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh release create "$TAG" \
            --prerelease \
            --title "$TAG" \
            --notes "Development build from branch \`${BRANCH_RAW}\` (PR #${PR_NUMBER}) at commit \`${COMMIT_SHA}\`." \
            || echo "Release already exists for this tag, skipping."

  # Main release-candidate dev builds — a push to main that changed the component,
  # once CI is green. Never for the "chore(main): release X.Y.Z" commit (matched via
  # ": release ") which release-please lands when its PR merges.
  dev-release-main:
    needs: [changes, lint, test, hacs_validate]
    if: >-
      needs.changes.outputs.component == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, ': release ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Compute next version
        id: nextver
        uses: TriPSs/conventional-changelog-action@952b14bbc4be87e8458a6ac5926fc655608b1b19 # v6
        with:
          github-token: ${{ github.token }}
          version-file: custom_components/sungrow/manifest.json
          version-path: version
          tag-prefix: v
          preset: conventionalcommits
          skip-on-empty: true
          skip-version-file: true
          skip-commit: true
          skip-tag: true
          skip-git-pull: true
          git-push: false
          output-file: false

      - name: Compute dev tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          SKIPPED: ${{ steps.nextver.outputs.skipped }}
          NEXT_VERSION: ${{ steps.nextver.outputs.version }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$SKIPPED" = "true" ] || [ -z "$NEXT_VERSION" ]; then
            VERSION=$(jq -r .version custom_components/sungrow/manifest.json)
          else
            VERSION="$NEXT_VERSION"
          fi
          # If this version is already fully released, remove any leftover RC
          # pre-releases for it and skip creating a new RC build.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            VERSION_REGEX=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
            echo "Full release v${VERSION} exists; deleting matching RC pre-releases."
            gh release list --limit 1000 --json tagName,isPrerelease \
              --jq ".[] | select(.isPrerelease and (.tagName | test(\"^dev-v${VERSION_REGEX}-rc[0-9]+$\"))) | .tagName" \
            | while read -r tag; do
                echo "Deleting stale RC pre-release: ${tag}"
                gh release delete "$tag" --yes --cleanup-tag
              done
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_BRANCH=main
          WORKFLOW_EVENT=push
          export VERSION RUN_ID HEAD_BRANCH WORKFLOW_EVENT
          TAG=$(bash scripts/compute-dev-tag.sh)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Prune superseded main RC pre-releases
        if: ${{ steps.tag.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # On main there should only be RC builds for the *current* next-version. When a
          # new feat/fix bumps the computed version (e.g. 3.2.1 -> 3.3.0), the earlier
          # dev-v<old>-rc* builds are superseded and will never ship — delete them now
          # rather than waiting for a real release or the 30-day sweep.
          gh release list --limit 1000 --json tagName,isPrerelease \
            --jq ".[] | select(.isPrerelease and (.tagName | test(\"^dev-v[0-9]+\\\\.[0-9]+\\\\.[0-9]+-rc[0-9]+$\"))) | .tagName" \
          | while read -r tag; do
              tag_version="${tag#dev-v}"
              tag_version="${tag_version%-rc*}"
              if [ "$tag_version" != "$VERSION" ]; then
                echo "Deleting superseded RC pre-release: ${tag} (version ${tag_version} != ${VERSION})"
                gh release delete "$tag" --yes --cleanup-tag
              fi
            done

      - name: Create pre-release
        if: ${{ steps.tag.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" \
            --prerelease \
            --title "$TAG" \
            --notes "Release-candidate build from \`main\` at commit \`${COMMIT_SHA}\`." \
            || echo "Release already exists for this tag, skipping."
