name: Publish Release

on:
    pull_request:
        types:
            - closed
        branches:
            - main

permissions:
    contents: write

concurrency:
    group: publish-release
    cancel-in-progress: false

jobs:
    publish:
        # Only publish for a merged release PR (label 'release' AND a release/v*
        # head branch) so an unrelated PR that happens to carry the label can't
        # trigger a real release.
        if: |
            github.event.pull_request.merged == true &&
            contains(github.event.pull_request.labels.*.name, 'release') &&
            startsWith(github.event.pull_request.head.ref, 'release/v')
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Extract version from manifest
              id: version
              run: |
                  VERSION=$(jq -r .version custom_components/sungrow/manifest.json)
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "Version extracted: ${VERSION}"

            - name: Extract latest changelog section
              run: |
                  # Publish only the newest version's notes, not the whole CHANGELOG.
                  # Print from the first version heading ("## [x.y.z]") up to the next.
                  awk '
                    /^#{1,2} \[[0-9]/ { n++; if (n > 1) exit }
                    n == 1 { print }
                  ' CHANGELOG.md > release_notes.md
                  if [ ! -s release_notes.md ]; then
                    echo "No version section matched; falling back to full CHANGELOG."
                    cp CHANGELOG.md release_notes.md
                  fi
                  echo "----- release notes -----"
                  cat release_notes.md

            - name: Create release tag and GitHub release
              uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
              with:
                  tag_name: v${{ steps.version.outputs.version }}
                  name: Release v${{ steps.version.outputs.version }}
                  body_path: release_notes.md
                  draft: false
                  prerelease: false
                  token: ${{ github.token }}

            - name: Delete main dev pre-releases
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  # A published release supersedes every main dev build, so remove
                  # all "dev-v<semver>-<n>" pre-releases regardless of version — the
                  # dev version now tracks the *next* version, which can drift
                  # (e.g. 1.1.0 dev builds when a later breaking change ships 2.0.0).
                  # PR dev builds ("dev-<branch>-v*") are cleaned up on PR close.
                  echo "Deleting all main dev pre-releases (dev-v<semver>-<n>)"
                  gh release list --limit 1000 --json tagName,isPrerelease \
                    --jq '.[] | select(.isPrerelease and (.tagName | test("^dev-v[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+$"))) | .tagName' \
                  | while read -r tag; do
                      echo "Deleting release and tag: ${tag}"
                      gh release delete "$tag" --yes --cleanup-tag
                    done
