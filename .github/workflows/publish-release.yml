name: Publish Release

on:
    pull_request:
        types:
            - closed
        branches:
            - main

permissions:
    contents: write

concurrency:
    group: publish-release
    cancel-in-progress: false

jobs:
    publish:
        if: |
            github.event.pull_request.merged == true &&
            contains(github.event.pull_request.labels.*.name, 'release')
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Extract version from manifest
              id: version
              run: |
                  VERSION=$(grep '"version":' custom_components/sungrow/manifest.json | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' | head -1)
                  echo "version=${VERSION}" >> $GITHUB_OUTPUT
                  echo "Version extracted: ${VERSION}"

            - name: Create release tag and GitHub release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: v${{ steps.version.outputs.version }}
                  name: Release v${{ steps.version.outputs.version }}
                  body_path: CHANGELOG.md
                  draft: false
                  prerelease: false
                  token: ${{ github.token }}

            - name: Delete dev pre-releases for this version
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  TAG_PREFIX="dev-v${{ steps.version.outputs.version }}-"
                  echo "Deleting pre-releases with tag prefix: ${TAG_PREFIX}"
                  gh release list --limit 1000 --json tagName,isPrerelease \
                    --jq ".[] | select(.isPrerelease and (.tagName | startswith(\"${TAG_PREFIX}\"))) | .tagName" \
                  | while read -r tag; do
                      echo "Deleting release and tag: ${tag}"
                      gh release delete "$tag" --yes --cleanup-tag
                    done
