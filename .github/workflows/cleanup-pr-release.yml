name: Cleanup PR dev releases

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete pre-releases for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Pass via env — never inline ${{ github.head_ref }} into the script
          # (shell-injection via a crafted branch name).
          BRANCH_RAW: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Delete a release and its tag ref, treating an already-missing tag
          # as success. A force-push or re-run can leave two dev pre-releases
          # sharing a tag ref; deleting the first with --cleanup-tag removes the
          # ref, so the second delete would 404 and (under `bash -e`) fail the
          # whole job. Instead we drop the release, then delete the tag ref only
          # if it still exists — the desired end state is "no such tag".
          delete_release_and_tag() {
            tag="$1"
            echo "Deleting release and tag: ${tag}"
            gh release delete "$tag" --yes 2>/dev/null || true
            if gh api "repos/${GH_REPO}/git/refs/tags/${tag}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GH_REPO}/git/refs/tags/${tag}" >/dev/null \
                && echo "Deleted tag ref ${tag}" \
                || echo "Warning: could not delete tag ref ${tag}"
            else
              echo "Tag ${tag} already absent — nothing to clean up"
            fi
          }

          BRANCH=$(printf '%s' "$BRANCH_RAW" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/-\{2,\}/-/g')
          echo "Deleting PR pre-releases for PR #${PR_NUMBER} (branch ${BRANCH})"

          # Current tags: vX.Y.Z-pr.<PR>.<run_id>
          # Legacy tags:  dev-vX.Y.Z-<branch>-<run_id>
          gh release list --limit 1000 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
          | while read -r tag; do
              delete=false
              if printf '%s' "$tag" | grep -Eq "^v[0-9]+\\.[0-9]+\\.[0-9]+-pr\\.${PR_NUMBER}\\."; then
                delete=true
              elif printf '%s' "$tag" | grep -Eq "^dev-v[0-9]+\\.[0-9]+\\.[0-9]+-${BRANCH}-[0-9]+$"; then
                delete=true
              fi
              if [ "$delete" = true ]; then
                delete_release_and_tag "$tag"
              fi
            done
